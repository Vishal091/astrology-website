window.showSection = function(section){

document.getElementById(
'consultationsSection'
).style.display =
section === 'consultations'
? 'block'
: 'none';



document.querySelector(
'.chat-top'

'.chat-input'

section === 'consultations'
? 'flex'
: 'none';

document.getElementById(
'ordersSection'
).style.display =
section === 'orders'
? 'block'
: 'none';
document.getElementById(
'productsSection'
).style.display =
section === 'products'
? 'flex'
: 'none';
document.getElementById(
'servicesSection'
).style.display =
section === 'services'
? 'block'
: 'none';
document.getElementById(
'consultationsTab'
).classList.remove('active');

document.getElementById(
'ordersTab'

document.getElementById(
'productsTab'

document.getElementById(
section + 'Tab'

'sidebarDynamicTitle'
).innerText =

section === 'consultations'
? '👥 Active Users'

: section === 'orders'
? '🛒 Recent Orders'

: section === 'services'
? '🪔 Services'
: '📦 Products';

}
let currentUser = "";

const userList =
document.getElementById("userList");

const messagesDiv =
document.getElementById("messages");

/* ===== LOAD USERS ===== */

const q = query(
collection(db,"consultations"),
orderBy("createdAt")
);

onSnapshot(q,(snapshot)=>{

const users = new Set();

snapshot.forEach(doc=>{

const data = doc.data();

users.add(data.user);

});

userList.innerHTML = "";

users.forEach(user=>{

const div =
document.createElement("div");

div.className = "chat-user";

div.innerHTML = `
<h3>${user}</h3>
<p>Active Consultation</p>
`;

div.onclick = ()=>{

currentUser = user;

loadMessages(user);


document.getElementById(
"chatUserName"
).innerText = user;


document.querySelectorAll(
".chat-user"
).forEach(el=>{

el.classList.remove("active");

});


div.classList.add("active");

};

userList.appendChild(div);

});

});

/* ===== LOAD MESSAGES ===== */

function loadMessages(user){

const q = query(
collection(db,"consultations"),
orderBy("createdAt")
);

onSnapshot(q,(snapshot)=>{

messagesDiv.innerHTML = "";

snapshot.forEach(doc=>{

const data = doc.data();

if(data.user !== user)
return;

const div =
document.createElement("div");

if(data.sender === "admin"){

div.className =
"message admin-msg";

}else{

div.className =
"message user-msg";

}


div.innerText = data.message;

messagesDiv.appendChild(div);

});

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

});

}
/* ===== LOAD REAL ORDERS ===== */

const SHEET_API =
'https://script.google.com/macros/s/AKfycbzLtLSyTc6mICyMm4SumcSbZBtqpF0ZJSla4LWolkzjIoZeqhTY7PZs1d9eau4bn8hb/exec';

const ordersList =
document.getElementById(
'ordersList'
);

async function loadOrders(){

try{

const res =
await fetch(SHEET_API);

const orders =
await res.json();

ordersList.innerHTML = '';

orders.reverse().forEach(order=>{

ordersList.innerHTML += `

<div class="order-card">

<h3>
${order.Name || 'Customer'}
</h3>

<p>
📞 ${order.Phone || ''}
</p>

<p>
📧 ${order.Email || ''}
</p>

<p>
📍 ${order.Address || ''}
</p>

<p>
🛒 ${order.Products || ''}
</p>

<p>
💳 ${order["Payment ID"] || ''}
</p>

<div class="order-total">
₹${order.Total || 0}
</div>

<div class="order-actions">

<button
class="order-btn whatsapp-btn"
onclick="
window.open(
'https://wa.me/91${order.Phone}'
)
"
>
WhatsApp
</button>

<button
class="order-btn copy-btn"
onclick="
navigator.clipboard.writeText(
'${order.Products}'
)
"
>
Copy
</button>

</div>

</div>

`;

});

}catch(error){

console.log(error);

ordersList.innerHTML = `
<p style="padding:20px;">
Failed to load orders
</p>
`;

}

}

loadOrders();

window.filterOrders = function(){
