
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrodhani Admin Panel</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:
linear-gradient(135deg,#120505,#2b0b0b);
color:white;
height:100vh;
overflow:hidden;
}

/* ===== HEADER ===== */

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 25px;
background:
linear-gradient(135deg,#5c0713,#7a0c18);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:24px;
font-weight:700;
color:#FFD700;
}

.admin-badge{
background:#FFD700;
color:black;
padding:10px 18px;
border-radius:30px;
font-weight:700;
}

/* ===== MAIN ===== */

.main{
display:grid;
grid-template-columns:320px 1fr;
height:calc(100vh - 80px);
}

/* ===== SIDEBAR ===== */

.sidebar{
background:#1a0b0b;
border-right:1px solid rgba(255,255,255,0.08);
overflow-y:auto;
}

.sidebar-title{
padding:20px;
font-size:18px;
font-weight:700;
color:#FFD700;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.chat-user{
padding:18px;
border-bottom:1px solid rgba(255,255,255,0.05);
cursor:pointer;
transition:0.3s;
}

.chat-user:hover,
.chat-user.active{
background:rgba(255,215,0,0.08);
}

.chat-user h3{
margin:0;
font-size:17px;
}

.chat-user p{
margin:6px 0 0;
font-size:13px;
color:#bbb;
}

/* ===== CHAT AREA ===== */

.chat-area{
display:flex;
flex-direction:column;
height:100%;
}

.chat-top{
padding:18px 25px;
border-bottom:1px solid rgba(255,255,255,0.08);
display:flex;
justify-content:space-between;
align-items:center;
background:#200909;
}

.chat-top h2{
margin:0;
font-size:22px;
}

.online{
color:#22c55e;
font-size:14px;
}

/* ===== MESSAGES ===== */

.messages{
flex:1;
padding:25px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:15px;
background:
linear-gradient(135deg,#120505,#2a0c0c);
}

.message{
max-width:70%;
padding:14px 18px;
border-radius:18px;
line-height:1.5;
font-size:15px;
word-wrap:break-word;
}

.user-msg{
align-self:flex-start;
background:#3b0d0d;
color:white;
}

.admin-msg{
align-self:flex-end;
background:linear-gradient(45deg,#FFD700,#ffb700);
color:black;
font-weight:600;
}

/* ===== INPUT ===== */

.chat-input{
display:flex;
gap:10px;
padding:18px;
background:#1a0b0b;
border-top:1px solid rgba(255,255,255,0.08);
}

.chat-input input{
flex:1;
padding:14px;
border:none;
border-radius:14px;
font-size:15px;
outline:none;
}

.chat-input button{
padding:14px 24px;
border:none;
border-radius:14px;
background:
linear-gradient(45deg,#FFD700,#ffb700);
color:black;
font-weight:700;
cursor:pointer;
}

/* ===== EMPTY ===== */

.empty{
flex:1;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#999;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

.main{
grid-template-columns:1fr;
}

.sidebar{
height:220px;
}

.message{
max-width:90%;
}

.chat-top h2{
font-size:18px;
}

}
/* MENU */

.sidebar-menu{

padding:14px;

display:flex;

flex-direction:column;

gap:10px;

border-bottom:
1px solid rgba(255,255,255,0.08);

}

.menu-item{

padding:14px 16px;

border-radius:14px;

cursor:pointer;

font-weight:600;

transition:.3s;

background:
rgba(255,255,255,0.03);

}

.menu-item:hover{

background:
rgba(255,215,0,0.08);

}

.menu-item.active{

background:
linear-gradient(
45deg,
#FFD700,
#ffb700
);

color:black;

}
/* ORDERS */

.orders-container{

padding:14px;

}

.orders-header input{

width:100%;

padding:14px;

border:none;

border-radius:14px;

outline:none;

font-size:14px;

margin-bottom:14px;

}

.order-card{

padding:16px;

border-radius:16px;

margin-bottom:12px;

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.06);

}

.order-card h3{

margin:0 0 8px;

font-size:16px;

color:#FFD700;

}

.order-card p{

margin:4px 0;

font-size:13px;

color:#ddd;

}

.order-total{

font-size:18px;

font-weight:700;

margin-top:10px;

color:#22c55e;

}

.order-actions{

display:flex;

gap:10px;

margin-top:12px;

}

.order-btn{

flex:1;

padding:10px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:600;

}

.whatsapp-btn{

background:#25D366;

color:white;

}

.copy-btn{

background:#FFD700;

color:black;

}
</style>
</head>
<body>

<div class="header">

<div class="logo">
🔮 Astrodhani Admin
</div>

<div style="display:flex;gap:12px;align-items:center;">

<div class="admin-badge">
LIVE CONSULTATIONS
</div>

<button onclick="logoutAdmin()"
style="
padding:10px 16px;
border:none;
border-radius:12px;
background:#FFD700;
font-weight:700;
cursor:pointer;
">

Logout

</button>

</div>

</div>

<div class="main">

<!-- ===== SIDEBAR ===== -->

<div class="sidebar">

<div class="sidebar-menu">

<div
class="menu-item active"
onclick="showSection('consultations')"
id="consultationsTab"
>
💬 Consultations
</div>

<div
class="menu-item"
onclick="showSection('orders')"
id="ordersTab"
>
🛒 Orders
</div>

</div>

<div class="sidebar-title"
id="sidebarDynamicTitle">
👥 Active Users
</div>

<div id="consultationsSection">

<div id="userList"></div>

</div>

<div
id="ordersSection"
style="display:none;"
>

<div class="orders-container">

<div class="orders-header">

<input
type="text"
id="orderSearch"
placeholder="Search orders..."
onkeyup="filterOrders()"
/>

</div>

<div id="ordersList"></div>

</div>

</div>

</div>

<!-- ===== CHAT ===== -->

<div class="chat-area">

<div class="chat-top">

<div>
<h2 id="chatUserName">
Select User
</h2>

<div class="online">
● Online
</div>
</div>

</div>

<div class="messages"
id="messages">

<div class="empty">
Select a consultation
</div>

</div>

<div class="chat-input">

<input type="text"
id="replyInput"
placeholder="Type reply...">

<button onclick="sendReply()">
Send
</button>

</div>

</div>

</div>

<script type="module">

/* ===== FIREBASE ===== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== YOUR FIREBASE CONFIG ===== */

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain: "astrodhani-935c8.firebaseapp.com",

projectId: "astrodhani-935c8",

storageBucket: "astrodhani-935c8.firebasestorage.app",

messagingSenderId: "158324229234",

appId: "1:158324229234:web:bff8d74888b356be362eeb"

};

const app = initializeApp(firebaseConfig);
const auth =
getAuth(app);
const db = getFirestore(app);
/* ===== ADMIN AUTH CHECK ===== */

/* ===== ADMIN AUTH CHECK ===== */

onAuthStateChanged(auth,(user)=>{

const allowedAdmin =
"support@astrodhani.com";

if(
!user ||
user.email !== allowedAdmin
){

window.location.href =
"admin-login.html";

}

});
/* ===== GLOBAL ===== */
window.showSection = function(section){

document.getElementById(
'consultationsSection'
).style.display =
section === 'consultations'
? 'block'
: 'none';

document.getElementById(
'ordersSection'
).style.display =
section === 'orders'
? 'block'
: 'none';

document.getElementById(
'consultationsTab'
).classList.remove('active');

document.getElementById(
'ordersTab'
).classList.remove('active');

document.getElementById(
section + 'Tab'
).classList.add('active');

document.getElementById(
'sidebarDynamicTitle'
).innerText =
section === 'consultations'
? '👥 Active Users'
: '🛒 Recent Orders';

}
let currentUser = "";

const userList =
document.getElementById("userList");

const messagesDiv =
document.getElementById("messages");

/* ===== LOAD USERS ===== */

const q = query(
collection(db,"consultations"),
orderBy("createdAt")
);

onSnapshot(q,(snapshot)=>{

const users = new Set();

snapshot.forEach(doc=>{

const data = doc.data();

users.add(data.user);

});

userList.innerHTML = "";

users.forEach(user=>{

const div =
document.createElement("div");

div.className = "chat-user";

div.innerHTML = `
<h3>${user}</h3>
<p>Active Consultation</p>
`;

div.onclick = ()=>{

currentUser = user;

loadMessages(user);


document.getElementById(
"chatUserName"
).innerText = user;


document.querySelectorAll(
".chat-user"
).forEach(el=>{

el.classList.remove("active");

});


div.classList.add("active");

};

userList.appendChild(div);

});

});

/* ===== LOAD MESSAGES ===== */

function loadMessages(user){

const q = query(
collection(db,"consultations"),
orderBy("createdAt")
);

onSnapshot(q,(snapshot)=>{

messagesDiv.innerHTML = "";

snapshot.forEach(doc=>{

const data = doc.data();

if(data.user !== user)
return;

const div =
document.createElement("div");

if(data.sender === "admin"){

div.className =
"message admin-msg";

}else{

div.className =
"message user-msg";

}


div.innerText = data.message;

messagesDiv.appendChild(div);

});

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

});

}
/* ===== LOAD REAL ORDERS ===== */

const SHEET_API =
'https://script.google.com/macros/s/AKfycbzLtLSyTc6mICyMm4SumcSbZBtqpF0ZJSla4LWolkzjIoZeqhTY7PZs1d9eau4bn8hb/exec';

const ordersList =
document.getElementById(
'ordersList'
);

async function loadOrders(){

try{

const res =
await fetch(SHEET_API);

const orders =
await res.json();

ordersList.innerHTML = '';

orders.reverse().forEach(order=>{

ordersList.innerHTML += `

<div class="order-card">

<h3>
${order.Name || 'Customer'}
</h3>

<p>
📞 ${order.Phone || ''}
</p>

<p>
📧 ${order.Email || ''}
</p>

<p>
📍 ${order.Address || ''}
</p>

<p>
🛒 ${order.Products || ''}
</p>

<p>
💳 ${order["Payment ID"] || ''}
</p>

<div class="order-total">
₹${order.Total || 0}
</div>

<div class="order-actions">

<button
class="order-btn whatsapp-btn"
onclick="
window.open(
'https://wa.me/91${order.Phone}'
)
"
>
WhatsApp
</button>

<button
class="order-btn copy-btn"
onclick="
navigator.clipboard.writeText(
'${order.Products}'
)
"
>
Copy
</button>

</div>

</div>

`;

});

}catch(error){

console.log(error);

ordersList.innerHTML = `
<p style="padding:20px;">
Failed to load orders
</p>
`;

}

}

loadOrders();

window.filterOrders = function(){

const search =
document.getElementById(
'orderSearch'
).value.toLowerCase();

document.querySelectorAll(
'.order-card'
).forEach(card=>{

card.style.display =
card.innerText
.toLowerCase()
.includes(search)
? 'block'
: 'none';

});

}
/* ===== SEND REPLY ===== */

window.sendReply = async function(){

if(!currentUser)
return;

const input =
document.getElementById("replyInput");

const msg = input.value;

if(!msg)
return;

await addDoc(
collection(db,"consultations"),
{
user:currentUser,
message:msg,
sender:"admin",
createdAt:serverTimestamp()
}
);

input.value = "";

}
/* ===== LOGOUT ===== */

window.logoutAdmin = async function(){

await signOut(auth);

window.location.href =
"admin-login.html";

}
</script>

</body>
</html>
