<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Astrodhani Product</title>

<style>

/* ===== NAVBAR ===== */

.navbar{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 7%;

background:#4c0519;

position:sticky;

top:0;

z-index:1000;

}

.logo a{

font-size:30px;

font-weight:800;

color:#FFD700;

text-decoration:none;

}

.nav-links{

display:flex;

gap:28px;

}

.nav-links a{

color:white;

text-decoration:none;

font-weight:600;

transition:.3s;

}

.nav-links a:hover{

color:#FFD700;

}

/* ===== FOOTER ===== */

.footer{

padding:70px 20px;

text-align:center;

background:#4c0519;

color:white;

margin-top:80px;

}

.footer h2{

font-size:38px;

margin-bottom:12px;

color:#FFD700;

}

.footer-links{

display:flex;

justify-content:center;

gap:24px;

margin:30px 0;

flex-wrap:wrap;

}

.footer-links a{

color:white;

text-decoration:none;

font-weight:600;

}

.footer-copy{

opacity:.7;

margin-top:24px;

}

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#f8f5f2;
color:#222;
}

.header{
padding:20px;
background:#5c0713;
color:white;
font-size:24px;
font-weight:700;
}


.container{

max-width:1300px;

margin:auto;

padding:70px 5%;

display:grid;

grid-template-columns:1fr 1fr;

gap:70px;

align-items:center;

}



.product-image img{

width:100%;

border-radius:32px;

box-shadow:
0 30px 60px rgba(0,0,0,0.12);

transition:.4s;

}

.product-image img:hover{

transform:scale(1.03);

}


.product-info h1{
font-size:42px;
margin:0 0 20px;
color:#5c0713;
}

.price{
font-size:34px;
font-weight:700;
color:#d97706;
margin-bottom:20px;
}

.description{
line-height:1.8;
font-size:18px;
margin-bottom:30px;
}

.buy-btn{
padding:16px 30px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,#FFD700,#ffb700);
font-size:18px;
font-weight:700;
cursor:pointer;
}

.reviews{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.review-card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.review-card h3{
margin:0;
color:#5c0713;
}

@media(max-width:768px){

.navbar{

flex-direction:column;

gap:16px;

}

.nav-links{

gap:18px;

flex-wrap:wrap;

justify-content:center;

}

.buy-btn{

width:100%;

}

.container{
grid-template-columns:1fr;
}

.product-info h1{
font-size:32px;
}

}

</style>
</head>
<body>

<!-- ===== NAVBAR ===== -->

<nav class="navbar">

<div class="logo">

<a href="index.html">

🔮 Astrodhani

</a>

</div>

<div class="nav-links">

<a href="shop.html">
Shop
</a>

<a href="services.html">
Services
</a>

<a href="blogs.html">
Blogs
</a>

<a href="cart.html">
Cart
</a>

</div>

</nav>

<div class="header">
🔮 Astrodhani
</div>

<div class="container">

<div class="product-image">
<img id="productImage">
</div>

<div class="product-info">

<h1 id="productName"></h1>

<div class="price">
₹<span id="productPrice"></span>
</div>

<div
class="description"
id="productDescription"
></div>

<button
class="buy-btn"
id="buyNowBtn"
>
Buy Now
</button>



</div>

</div>

<div class="reviews">

<h2>
Customer Reviews
</h2>

<div id="reviewsContainer"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
getDoc,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain: "astrodhani-935c8.firebaseapp.com",

projectId: "astrodhani-935c8",

storageBucket: "astrodhani-935c8.firebasestorage.app",

messagingSenderId: "158324229234",

appId: "1:158324229234:web:bff8d74888b356be362eeb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const params =
new URLSearchParams(window.location.search);

const productId =
params.get('id');

async function loadProduct(){

const productRef =
doc(db,'products',productId);

const productSnap =
await getDoc(productRef);

if(!productSnap.exists()){

document.body.innerHTML =
'<h1>Product Not Found</h1>';

return;

}

const product =
productSnap.data();

document.getElementById(
'productImage'
).src =
product.image || '';

document.getElementById(
'productName'
).innerText =
product.name || '';

document.getElementById(
'productPrice'
).innerText =
product.price || '';

document.getElementById(
'productDescription'
).innerText =
product.description || '';

loadReviews(product.name);

}

async function loadReviews(productName){

const snapshot =
await getDocs(
collection(db,'testimonials')
);

const container =
document.getElementById(
'reviewsContainer'
);

snapshot.forEach(docSnap=>{

const review =
docSnap.data();

if(review.service !== productName)
return;

container.innerHTML += `

<div class="review-card">

<h3>
${review.name}
</h3>

<p>
⭐ ${review.rating}/5
</p>

<p>
"${review.review}"
</p>

</div>

`;

});

}
document
.getElementById(
'buyNowBtn'
)
.addEventListener(
'click',
()=>{

const product = {

id:productId,

name:
document.getElementById(
'productName'
).innerText,

price:
document.getElementById(
'productPrice'
).innerText,

image:
document.getElementById(
'productImage'
).src,

quantity:1

};

let cart =
JSON.parse(
localStorage.getItem('cart')
|| '[]'
);

const existing =
cart.find(
p=>p.id === product.id
);

if(existing){

existing.quantity += 1;

}else{

cart.push(product);

}

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

window.location.href =
'cart.html';

}
);

loadProduct();

</script>
