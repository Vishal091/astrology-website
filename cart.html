<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Astrodhani Cart
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
180deg,
#fff7ed,
#fff1f2
);

color:#4c0519;

}

/* HEADER */

header{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 5%;

background:
linear-gradient(
135deg,
#a3031a,
#b91c1c
);

color:white;

}

.logo{

font-size:32px;

font-weight:700;

}

.back-btn{

text-decoration:none;

color:white;

font-weight:600;

}

/* PAGE */

.cart-page{

padding:50px 5%;

display:grid;

grid-template-columns:
2fr 1fr;

gap:40px;

}

/* CART ITEMS */

.cart-items{

display:flex;

flex-direction:column;

gap:22px;

}

.cart-card{

background:white;

border-radius:28px;

padding:24px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

}

.cart-info h3{

font-size:22px;

margin-bottom:10px;

color:#8b111c;

}

.cart-info p{

font-size:18px;

font-weight:700;

color:#dc2626;

}

/* ACTIONS */

.cart-actions{

display:flex;

align-items:center;

gap:12px;

}

.qty-btn{

width:38px;
height:38px;

border:none;

border-radius:50%;

cursor:pointer;

font-size:18px;

background:
linear-gradient(
135deg,
#8b111c,
#b3262e
);

color:white;

}

.qty{

font-size:18px;

font-weight:600;

width:28px;

text-align:center;

}

.remove-btn{

border:none;

background:none;

color:#dc2626;

cursor:pointer;

font-weight:600;

font-size:15px;

}

/* SUMMARY */

.cart-summary{

background:white;

padding:30px;

border-radius:30px;

height:fit-content;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

position:sticky;

top:20px;

}

.cart-summary h2{

margin-bottom:25px;

color:#8b111c;

}

.summary-row{

display:flex;

justify-content:space-between;

margin-bottom:18px;

font-size:16px;

}

.summary-total{

font-size:24px;

font-weight:700;

color:#dc2626;

margin:
25px 0;

display:flex;

justify-content:space-between;

}

.checkout-btn{

width:100%;

padding:18px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:16px;

font-weight:700;

color:white;

background:
linear-gradient(
135deg,
#25D366,
#128C7E
);

margin-bottom:14px;

transition:.3s;

}

.checkout-btn:hover{

transform:translateY(-2px);

}

.shop-btn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:15px;

font-weight:600;

background:
linear-gradient(
135deg,
#8b111c,
#b3262e
);

color:white;

}

/* EMPTY */

.empty-cart{

background:white;

padding:70px 20px;

border-radius:30px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

}

.empty-cart h2{

font-size:40px;

margin-bottom:14px;

color:#8b111c;

}

.empty-cart p{

margin-bottom:30px;

color:#666;

}

/* MOBILE */

@media(max-width:900px){

.cart-page{

display:flex;

flex-direction:column;

gap:25px;

padding:25px 20px 120px;

}

.cart-items{

width:100%;

display:flex;

flex-direction:column;

gap:18px;

}

.cart-card{

width:100%;

flex-direction:column;

align-items:flex-start;

gap:18px;

padding:20px;

border-radius:24px;

}

.cart-info{

width:100%;

}

.cart-info h3{

font-size:18px;

line-height:1.5;

}

.cart-actions{

width:100%;

justify-content:space-between;

}

.cart-summary{

width:100%;

position:static;

padding:24px;

border-radius:26px;

}

.summary-total{

font-size:22px;

}

.checkout-btn,
.shop-btn{

padding:16px;

font-size:15px;

}

}
/* COUPON */

.coupon-box{

display:flex;

gap:10px;

margin:
25px 0 10px;

}

.coupon-box input{

flex:1;

padding:14px;

border-radius:14px;

border:
1px solid rgba(139,17,28,0.12);

font-family:'Poppins',sans-serif;

font-size:14px;

}

.coupon-box button{

padding:
14px 20px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:600;

background:
linear-gradient(
135deg,
#8b111c,
#b3262e
);

color:white;

}

#couponMessage{

font-size:14px;

margin-bottom:15px;

color:#16a34a;

}
/* CHECKOUT FORM */

.checkout-form{

margin-bottom:30px;

display:flex;

flex-direction:column;

gap:14px;

}

.checkout-form h3{

font-size:22px;

margin-bottom:6px;

color:#8b111c;

}

.checkout-form input,
.checkout-form textarea{

width:100%;

padding:16px;

border-radius:16px;

border:
1px solid rgba(139,17,28,0.1);

font-family:'Poppins',sans-serif;

font-size:14px;

background:white;

transition:.3s;

}

.checkout-form textarea{

height:100px;

resize:none;

}

.checkout-form input:focus,
.checkout-form textarea:focus{

outline:none;

border-color:#8b111c;

box-shadow:
0 0 0 4px rgba(139,17,28,0.08);

}

.form-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

/* MOBILE */

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

}
</style>

</head>

<body>

<header>

<div class="logo">
🔮 Astrodhani
</div>

<a
href="shop.html"
class="back-btn"
>
← Continue Shopping
</a>

</header>

<section class="cart-page">

<div
class="cart-items"
id="cartItems"
>

</div>

<div class="cart-summary">
<div class="checkout-form">

<h3>
Customer Details
</h3>

<input
type="text"
id="customerName"
placeholder="Full Name"
/>

<input
type="tel"
id="customerPhone"
placeholder="Phone Number"
/>

<input
type="email"
id="customerEmail"
placeholder="Email Address"
/>

<textarea
id="customerAddress"
placeholder="Full Address"
></textarea>

<div class="form-grid">

<input
type="text"
id="customerCity"
placeholder="City"
/>

<input
type="text"
id="customerState"
placeholder="State"
/>

</div>

<input
type="text"
id="customerPincode"
placeholder="Pincode"
/>

</div>
<h2>
Order Summary
</h2>

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">
₹0
</span>
</div>

<div class="summary-row">
<span>Shipping</span>
<span>
Free
</span>
</div>
<div class="coupon-box">

<input
type="text"
id="couponInput"
placeholder="Enter Coupon Code"
/>

<button onclick="applyCoupon()">
Apply
</button>

</div>

<p id="couponMessage"></p>
<div class="summary-total">
<span>Total</span>
<span id="total">
₹0
</span>
</div>

<button
class="checkout-btn"
onclick="payNow()"
>
Proceed to Payment
</button>

<button
class="shop-btn"
onclick="window.location.href='index.html'"
>
Continue Shopping
</button>

</div>

</section>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



let cart = [];

try{

cart =
JSON.parse(
localStorage.getItem('cart')
) || [];

}catch{

cart = [];

}

function renderCart(){

const cartItems =
document.getElementById(
'cartItems'
);

cartItems.innerHTML = '';

if(cart.length === 0){

cartItems.innerHTML = `

<div class="empty-cart">

<h2>
🛒 Your Cart is Empty
</h2>

<p>
Add spiritual products to begin your journey.
</p>

<button
class="shop-btn"
onclick="window.location.href='index.html'"
>
Shop Now
</button>

</div>

`;

updateSummary();

return;

}

cart.forEach((item,index)=>{

cartItems.innerHTML += `


<div class="cart-card">

<div
style="
display:flex;
gap:18px;
align-items:center;
"
>

<img
src="${item.image || 'https://dummyimage.com/300'}"
style="
width:100px;
height:100px;
object-fit:cover;
border-radius:20px;
"
>

<div class="cart-info">

<div
style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
"
>

<h3>
${item.name}
</h3>

<span
style="
background:
linear-gradient(
135deg,
#8b111c,
#f59e0b
);
color:white;
padding:6px 12px;
border-radius:30px;
font-size:11px;
font-weight:700;
text-transform:uppercase;
"
>
${item.type || 'product'}
</span>

</div>

<p>
₹${item.price}
</p>

</div>

</div>

<div class="cart-actions">

<button
class="qty-btn"
onclick="decreaseQty(${index})"
>
−
</button>

<div class="qty">
${item.qty || 1}
</div>

<button
class="qty-btn"
onclick="increaseQty(${index})"
>
+
</button>

<button
class="remove-btn"
onclick="removeItem(${index})"
>
Remove
</button>

</div>

</div>



`;

});

updateSummary();

}
let appliedDiscount = 0;
function updateSummary(){

let subtotal = 0;

cart.forEach(item => {

subtotal +=
Number(item.price) *
(item.qty || 1);

});

let finalTotal =
subtotal - appliedDiscount;

if(finalTotal < 0){
finalTotal = 0;
}

document.getElementById(
'subtotal'
).innerText =
'₹' + subtotal;

document.getElementById(
'total'
).innerText =
'₹' + finalTotal;

}
function applyCoupon(){

const code =
document.getElementById(
'couponInput'
).value.trim();

const message =
document.getElementById(
'couponMessage'
);

let subtotal = 0;

cart.forEach(item => {

subtotal +=
item.price * (item.qty || 1);

});

if(code === 'FREE100'){

appliedDiscount = subtotal;

message.innerText =
'100% discount applied successfully 🎉';

}else{

appliedDiscount = 0;

message.innerText =
'Invalid coupon code';

message.style.color =
'#dc2626';

}

updateSummary();

}
function increaseQty(index){

if(cart[index].type === 'service'){
return;
}

if(!cart[index].qty){
cart[index].qty = 1;
}

cart[index].qty++;

saveCart();

}

function decreaseQty(index){

if(!cart[index].qty){
cart[index].qty = 1;
}

if(cart[index].qty > 1){

cart[index].qty--;

}else{

cart.splice(index,1);

}

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

renderCart();

}
/* ===== FIREBASE ===== */

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain:
"astrodhani-935c8.firebaseapp.com",

projectId:
"astrodhani-935c8",

storageBucket:
"astrodhani-935c8.firebasestorage.app",

messagingSenderId:
"158324229234",

appId:
"1:158324229234:web:bff8d74888b356be362eeb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);



const ORDER_API =
'https://script.google.com/macros/s/AKfycbzLtLSyTc6mICyMm4SumcSbZBtqpF0ZJSla4LWolkzjIoZeqhTY7PZs1d9eau4bn8hb/exec';
function payNow(){
const name =
document.getElementById(
'customerName'
).value.trim();

const phone =
document.getElementById(
'customerPhone'
).value.trim();

const email =
document.getElementById(
'customerEmail'
).value.trim();

const address =
document.getElementById(
'customerAddress'
).value.trim();

const city =
document.getElementById(
'customerCity'
).value.trim();

const state =
document.getElementById(
'customerState'
).value.trim();

const pincode =
document.getElementById(
'customerPincode'
).value.trim();

if(
!name ||
!phone ||
!email ||
!address ||
!city ||
!state ||
!pincode
){

alert(
'Please fill all customer details'
);

return;

}
if(cart.length === 0){
return;
}

let subtotal = 0;

cart.forEach(item => {

subtotal +=
Number(item.price) *
(item.qty || 1);

});

let total =
subtotal - appliedDiscount;

if(total < 0){
total = 0;
}

const options = {

key: "rzp_live_SnC4cMnOswIiWP",

amount: total * 100,

currency: "INR",

name: "Astrodhani",

description:
"Spiritual Products Purchase",

image:
"hanuman-logo.jpeg",

handler: async function (response) {

let total = 0;

cart.forEach(item => {

total +=
Number(item.price) *
(item.qty || 1);

});

const products =
cart.map(item =>

`[${item.type || 'product'}] ${item.name} x${item.qty || 1}`

).join(', ');

const orderData = {

userId:
auth.currentUser?.uid || '',

name,
phone,
email,
address,
city,
state,
pincode,

products,

cartData: cart,

total,

paymentId:
response.razorpay_payment_id,

status:'Paid',

createdAt:
new Date().toISOString()

};



try{

/* GOOGLE SHEET API */

await fetch(ORDER_API,{

method:'POST',

body:JSON.stringify(orderData)

});

/* FIRESTORE */

await addDoc(
collection(db,'orders'),
{

...orderData,

createdAt:
serverTimestamp()

}
);

}catch(error){

console.log(error);

}



localStorage.removeItem('cart');

window.location.href =
'success.html';

},

prefill: {

name: name,

email: email,

contact: phone

},

theme: {

color: "#8b111c"

},

method: {

upi: true,

card: true,

netbanking: true,

wallet: true,

emi: false,

paylater: false

},

config: {

display: {

blocks: {

upi: {

name: 'Pay using UPI',

instruments: [

{

method: 'upi'

}

]

}

},

sequence: ['block.upi'],

preferences: {

show_default_blocks: true

}

}

}


};

const rzp =
new Razorpay(options);

rzp.open();

}


window.addEventListener(
'DOMContentLoaded',
renderCart
);

</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>

</html>
