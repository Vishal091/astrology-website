<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
Astrodhani Cart
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(
180deg,
#fff7ed,
#fff1f2
);

color:#4c0519;

}

/* HEADER */

header{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 5%;

background:
linear-gradient(
135deg,
#a3031a,
#b91c1c
);

color:white;

}

.logo{

font-size:32px;

font-weight:700;

}

.back-btn{

text-decoration:none;

color:white;

font-weight:600;

}

/* PAGE */

.cart-page{

padding:50px 5%;

display:grid;

grid-template-columns:
2fr 1fr;

gap:40px;

}

/* CART ITEMS */

.cart-items{

display:flex;

flex-direction:column;

gap:22px;

}

.cart-card{

background:white;

border-radius:28px;

padding:24px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

}

.cart-info h3{

font-size:22px;

margin-bottom:10px;

color:#8b111c;

}

.cart-info p{

font-size:18px;

font-weight:700;

color:#dc2626;

}

/* ACTIONS */

.cart-actions{

display:flex;

align-items:center;

gap:12px;

}

.qty-btn{

width:38px;
height:38px;

border:none;

border-radius:50%;

cursor:pointer;

font-size:18px;

background:
linear-gradient(
135deg,
#8b111c,
#b3262e
);

color:white;

}

.qty{

font-size:18px;

font-weight:600;

width:28px;

text-align:center;

}

.remove-btn{

border:none;

background:none;

color:#dc2626;

cursor:pointer;

font-weight:600;

font-size:15px;

}

/* SUMMARY */

.cart-summary{

background:white;

padding:30px;

border-radius:30px;

height:fit-content;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

position:sticky;

top:20px;

}

.cart-summary h2{

margin-bottom:25px;

color:#8b111c;

}

.summary-row{

display:flex;

justify-content:space-between;

margin-bottom:18px;

font-size:16px;

}

.summary-total{

font-size:24px;

font-weight:700;

color:#dc2626;

margin:
25px 0;

display:flex;

justify-content:space-between;

}

.checkout-btn{

width:100%;

padding:18px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:16px;

font-weight:700;

color:white;

background:
linear-gradient(
135deg,
#25D366,
#128C7E
);

margin-bottom:14px;

transition:.3s;

}

.checkout-btn:hover{

transform:translateY(-2px);

}

.shop-btn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:15px;

font-weight:600;

background:
linear-gradient(
135deg,
#8b111c,
#b3262e
);

color:white;

}

/* EMPTY */

.empty-cart{

background:white;

padding:70px 20px;

border-radius:30px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,0.05);

}

.empty-cart h2{

font-size:40px;

margin-bottom:14px;

color:#8b111c;

}

.empty-cart p{

margin-bottom:30px;

color:#666;

}

/* MOBILE */

@media(max-width:900px){

.cart-page{

grid-template-columns:1fr;

}

.cart-card{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

.cart-summary{

position:static;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
🔮 Astrodhani
</div>

<a
href="shop.html"
class="back-btn"
>
← Continue Shopping
</a>

</header>

<section class="cart-page">

<div
class="cart-items"
id="cartItems"
>

</div>

<div class="cart-summary">

<h2>
Order Summary
</h2>

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">
₹0
</span>
</div>

<div class="summary-row">
<span>Shipping</span>
<span>
Free
</span>
</div>

<div class="summary-total">
<span>Total</span>
<span id="total">
₹0
</span>
</div>

<button
class="checkout-btn"
onclick="payNow()"
>
Proceed to Payment
</button>

<button
class="shop-btn"
onclick="window.location.href='shop.html'"
>
Continue Shopping
</button>

</div>

</section>

<script>

let cart =
JSON.parse(
localStorage.getItem('cart')
) || [];

function renderCart(){

const cartItems =
document.getElementById(
'cartItems'
);

cartItems.innerHTML = '';

if(cart.length === 0){

cartItems.innerHTML = `

<div class="empty-cart">

<h2>
🛒 Your Cart is Empty
</h2>

<p>
Add spiritual products to begin your journey.
</p>

<button
class="shop-btn"
onclick="window.location.href='shop.html'"
>
Shop Now
</button>

</div>

`;

updateSummary();

return;

}

cart.forEach((item,index)=>{

cartItems.innerHTML += `

<div class="cart-card">

<div class="cart-info">

<h3>
${item.name}
</h3>

<p>
₹${item.price}
</p>

</div>

<div class="cart-actions">

<button
class="qty-btn"
onclick="decreaseQty(${index})"
>
−
</button>

<div class="qty">
${item.qty || 1}
</div>

<button
class="qty-btn"
onclick="increaseQty(${index})"
>
+
</button>

<button
class="remove-btn"
onclick="removeItem(${index})"
>
Remove
</button>

</div>

</div>

`;

});

updateSummary();

}

function updateSummary(){

let subtotal = 0;

cart.forEach(item => {

subtotal +=
item.price * (item.qty || 1);

});

document.getElementById(
'subtotal'
).innerText =
'₹' + subtotal;

document.getElementById(
'total'
).innerText =
'₹' + subtotal;

}

function increaseQty(index){

if(!cart[index].qty){
cart[index].qty = 1;
}

cart[index].qty++;

saveCart();

}

function decreaseQty(index){

if(!cart[index].qty){
cart[index].qty = 1;
}

if(cart[index].qty > 1){

cart[index].qty--;

}else{

cart.splice(index,1);

}

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
'cart',
JSON.stringify(cart)
);

renderCart();

}
function payNow(){

if(cart.length === 0){
return;
}

let total = 0;

cart.forEach(item => {

total +=
item.price * (item.qty || 1);

});

const options = {

key: "rzp_live_SnC4cMnOswIiWP",

amount: total * 100,

currency: "INR",

name: "Astrodhani",

description:
"Spiritual Products Purchase",

image:
"hanuman-logo.jpeg",

handler: function (response) {

localStorage.removeItem('cart');

alert(
'Payment Successful! 🎉'
);

window.location.href =
'success.html';

},

prefill: {

name: "",

email: "",

contact: ""

},

theme: {

color: "#8b111c"

}

};

const rzp =
new Razorpay(options);

rzp.open();

}


renderCart();

</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>

</html>
