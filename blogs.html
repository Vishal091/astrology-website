
<!DOCTYPE html>
<html>
<head>

<title>Astrodhani Blogs</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{

margin:0;

font-family:'Poppins',sans-serif;

background:
linear-gradient(
180deg,
#fff7ed,
#fff1f2
);

color:#4c0519;

overflow-x:hidden;

}

/* NAVBAR */

.navbar{

position:sticky;

top:0;

z-index:9999;

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 40px;

background:
rgba(74,12,12,0.92);

backdrop-filter:blur(12px);

}

.logo{

display:flex;

align-items:center;

gap:12px;

font-size:24px;

font-weight:800;

color:#FFD700;

}

.logo img{

width:50px;
height:50px;

border-radius:50%;

object-fit:cover;

}

nav{

display:flex;

gap:28px;

}

nav a{

text-decoration:none;

color:white;

font-weight:600;

}

nav a:hover{

color:#FFD700;

}

/* HERO */

.blog-hero{

padding:100px 20px;

text-align:center;

background:
linear-gradient(
135deg,
#7f1d1d,
#991b1b,
#450a0a
);

color:white;

}

.blog-hero h1{

font-size:64px;

margin-bottom:18px;

}

.blog-hero p{

font-size:20px;

opacity:.9;

}

/* BLOGS */

.blogs-container{

width:92%;

max-width:1400px;

margin:auto;

padding:80px 0;

}

.blog-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(340px,1fr));

gap:34px;

}

.blog-card{

background:white;

border-radius:28px;

overflow:hidden;

box-shadow:
0 20px 50px rgba(0,0,0,0.08);

transition:.4s;

}

.blog-card:hover{

transform:
translateY(-10px);

}

.blog-image{

width:100%;

height:260px;

object-fit:cover;

}

.blog-content{

padding:28px;

}

.blog-category{

display:inline-block;

padding:8px 16px;

border-radius:40px;

font-size:12px;

font-weight:700;

margin-bottom:18px;

background:
linear-gradient(
135deg,
#8b111c,
#f59e0b
);

color:white;

}

.blog-title{

font-size:28px;

font-weight:800;

line-height:1.3;

margin-bottom:14px;

color:#7f1d1d;

}

.blog-excerpt{

font-size:15px;

line-height:1.8;

color:#555;

margin-bottom:24px;

}

.read-btn{

padding:14px 24px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

background:
linear-gradient(
135deg,
#8b111c,
#f59e0b
);

color:white;

}

/* FOOTER */

.footer{

background:
linear-gradient(
135deg,
#2a0000,
#5c0713
);

color:white;

padding:70px 20px 30px;

margin-top:80px;

}

.footer-content{

max-width:1200px;

margin:auto;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(240px,1fr));

gap:40px;

}

.footer h3,
.footer h4{

color:#FFD700;

margin-bottom:18px;

}

.footer a{

display:block;

margin-bottom:10px;

text-decoration:none;

color:white;

}

.footer-bottom{

text-align:center;

margin-top:50px;

padding-top:20px;

border-top:
1px solid rgba(255,255,255,0.1);

opacity:.7;

}

/* MOBILE */

@media(max-width:768px){

.navbar{

padding:16px 18px;

}

nav{

display:none;

}

.blog-hero h1{

font-size:42px;

}

.blog-hero p{

font-size:17px;

}

.blog-title{

font-size:24px;

}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

<div class="logo">

<img src="hanuman-logo.jpeg">

<span>
Astrodhani
</span>

</div>

<nav>

<a href="index.html">
Home
</a>

<a href="services.html">
Services
</a>

<a href="shop.html">
Shop
</a>

<a href="horoscope.html">
Horoscope
</a>

</nav>

</header>

<!-- HERO -->

<div class="blog-hero">

<h1>
📝 Astrology Blogs
</h1>

<p>
Spiritual wisdom, remedies and Vedic guidance
</p>

</div>

<!-- BLOGS -->

<div class="blogs-container">

<div
class="blog-grid"
id="blogGrid"
>

</div>

</div>

<!-- FOOTER -->

<footer class="footer">

<div class="footer-content">

<div>

<h3>
Astrodhani
</h3>

<p>
Premium astrology solutions for life, wealth and spiritual growth.
</p>

</div>

<div>

<h4>
Quick Links
</h4>

<a href="services.html">
Services
</a>

<a href="shop.html">
Shop
</a>

<a href="blogs.html">
Blogs
</a>

</div>

<div>

<h4>
Support
</h4>

<p>
support@astrodhani.com
</p>

<p>
+91 8708833177
</p>

</div>

</div>

<div class="footer-bottom">

© 2026 Astrodhani

</div>

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain: "astrodhani-935c8.firebaseapp.com",

projectId: "astrodhani-935c8",

storageBucket: "astrodhani-935c8.firebasestorage.app",

messagingSenderId: "158324229234",

appId: "1:158324229234:web:bff8d74888b356be362eeb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* LOAD BLOGS */

async function loadBlogs(){

const grid =
document.getElementById(
'blogGrid'
);

const snapshot =
await getDocs(
collection(db,'blogs')
);

grid.innerHTML = '';

snapshot.forEach(docSnap=>{

const blog = {

id:docSnap.id,

...docSnap.data()

};

grid.innerHTML += `

<div class="blog-card">

<img
src="${blog.image || ''}"
class="blog-image"
/>

<div class="blog-content">

<div class="blog-category">

${blog.category || 'Astrology'}

</div>

<div class="blog-title">

${blog.title || ''}

</div>

<div class="blog-excerpt">

${blog.excerpt || ''}

</div>

<button
class="read-btn"
onclick="
window.location.href=
'blog-details.html?id=${blog.id}'
"
>

Read More

</button>

</div>

</div>

`;

});

}

loadBlogs();

</script>

</body>
</html>
