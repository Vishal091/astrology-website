
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
Astrodhani Astrologer
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
Segoe UI,sans-serif;

background:
linear-gradient(
135deg,
#120202,
#1d0505,
#300808
);

color:white;

}

/* ===== NAVBAR ===== */

.navbar{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 7%;

background:#3b0606;

position:sticky;

top:0;

z-index:1000;

}

.logo{

font-size:32px;

font-weight:800;

color:#FFD700;

}

.nav-links{

display:flex;

gap:24px;

}

.nav-links a{

text-decoration:none;

color:white;

font-weight:600;

}

/* ===== PROFILE ===== */

.profile-wrapper{

max-width:1300px;

margin:auto;

padding:70px 5%;

display:grid;

grid-template-columns:
420px 1fr;

gap:60px;

align-items:start;

}

.profile-card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

border-radius:30px;

padding:30px;

position:sticky;

top:120px;

}

.profile-image{

width:100%;

height:460px;

object-fit:cover;

border-radius:24px;

margin-bottom:24px;

}

.profile-name{

font-size:38px;

font-weight:800;

margin-bottom:10px;

}

.profile-rating{

color:#FFD700;

font-size:18px;

margin-bottom:16px;

}

.profile-price{

font-size:30px;

font-weight:800;

margin-bottom:24px;

color:#ffcc00;

}

.consult-btn{

width:100%;

padding:18px;

border:none;

border-radius:16px;

background:
linear-gradient(
135deg,
#FFD700,
#ff9900
);

font-size:18px;

font-weight:800;

cursor:pointer;

}

/* ===== DETAILS ===== */

.details{

display:flex;

flex-direction:column;

gap:28px;

}

.info-box{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.06);

border-radius:24px;

padding:30px;

}

.info-box h2{

font-size:28px;

margin-bottom:18px;

color:#FFD700;

}

.info-text{

line-height:1.9;

font-size:17px;

color:#eee;

}

.tags{

display:flex;

gap:12px;

flex-wrap:wrap;

margin-top:18px;

}

.tag{

padding:10px 18px;

border-radius:999px;

background:#4c0519;

font-size:14px;

}
/* ===== CONSULTATION MODAL ===== */

.consultation-modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.7);

backdrop-filter:blur(8px);

display:none;

justify-content:center;

align-items:center;

z-index:99999;

padding:20px;

}

.consultation-box{

width:100%;
max-width:520px;

background:
linear-gradient(
135deg,
#220606,
#3b0606
);

border:
1px solid rgba(255,255,255,.08);

border-radius:28px;

padding:32px;

box-shadow:
0 20px 60px rgba(0,0,0,.45);

}

.modal-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.modal-header h2{

color:#FFD700;

font-size:28px;

}

.close-modal{

background:none;

border:none;

color:white;

font-size:26px;

cursor:pointer;

}

.modal-form{

display:flex;

flex-direction:column;

gap:22px;

}

.form-group{

display:flex;

flex-direction:column;

gap:10px;

}

.form-group label{

color:#FFD700;

font-weight:600;

}

.form-group input,
.form-group select{

padding:16px;

border:none;

outline:none;

border-radius:16px;

background:
rgba(255,255,255,.08);

color:white;

font-size:15px;

}

.book-btn{

padding:18px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
#FFD700,
#ff9900
);

font-size:17px;

font-weight:800;

cursor:pointer;

margin-top:10px;

}

/* ===== FOOTER ===== */

.footer{

margin-top:80px;

padding:60px 20px;

text-align:center;

background:#3b0606;

}

/* ===== MOBILE ===== */

@media(max-width:900px){

.profile-wrapper{

grid-template-columns:1fr;

}

.profile-card{

position:relative;

top:0;

}

.navbar{

flex-direction:column;

gap:16px;

}

}

</style>

</head>

<body>

<!-- ===== NAVBAR ===== -->

<nav class="navbar">

<div class="logo">
🔮 Astrodhani
</div>

<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="astrologers.html">
Astrologers
</a>

<a href="services.html">
Services
</a>

</div>

</nav>

<!-- ===== PROFILE ===== -->

<div class="profile-wrapper">

<div class="profile-card">

<img
id="astroImage"
class="profile-image"
>

<div
id="astroName"
class="profile-name"
></div>

<div
id="astroRating"
class="profile-rating"
></div>

<div
id="astroPrice"
class="profile-price"
></div>

<button
class="consult-btn"
id="consultBtn"
onclick="openConsultationModal()"
>



Consult Now

</button>

</div>

<div class="details">

<div class="info-box">

<h2>
🔮 Expertise
</h2>

<div
id="astroExpertise"
class="tags"
></div>

</div>

<div class="info-box">

<h2>
🌐 Languages
</h2>

<div
id="astroLanguages"
class="info-text"
></div>

</div>

<div class="info-box">

<h2>
📅 Experience
</h2>

<div
id="astroExperience"
class="info-text"
></div>

</div>

<div class="info-box">

<h2>
📖 About
</h2>

<div
id="astroAbout"
class="info-text"
></div>

</div>

</div>

</div>
<!-- ===== CONSULTATION MODAL ===== -->

<div
id="consultationModal"
class="consultation-modal"
>

<div class="consultation-box">

<div class="modal-header">

<h2>
🔮 Book Consultation
</h2>

<button
class="close-modal"
onclick="closeConsultationModal()"
>

✕

</button>

</div>

<div class="modal-form">

<div class="form-group">

<label>
Consultation Type
</label>

<select id="consultationType">

<option>
Chat Consultation
</option>

<option>
Call Consultation
</option>

<option>
Video Consultation
</option>

</select>

</div>

<div class="form-group">

<label>
Preferred Date
</label>

<input
type="date"
id="consultationDate"
>

</div>

<div class="form-group">

<label>
Preferred Time
</label>

<input
type="time"
id="consultationTime"
>

</div>

<button
class="book-btn"
onclick="bookConsultation()"
>

Proceed To Booking

</button>

</div>

</div>

</div>

<!-- ===== FOOTER ===== -->

<footer class="footer">

<h2>
🔮 Astrodhani
</h2>

<p>
Ancient Vedic Wisdom For Modern Life
</p>

</footer>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== FIREBASE ===== */

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain:
"astrodhani-935c8.firebaseapp.com",

projectId:
"astrodhani-935c8",

storageBucket:
"astrodhani-935c8.firebasestorage.app",

messagingSenderId:
"158324229234",

appId:
"1:158324229234:web:bff8d74888b356be362eeb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ===== GET ID ===== */

const params =
new URLSearchParams(
window.location.search
);

const astrologerId =
params.get('id');

/* ===== LOAD PROFILE ===== */

async function loadAstrologer(){

const snap =
await getDoc(
doc(
db,
'astrologers',
astrologerId
)
);

if(!snap.exists()){

document.body.innerHTML =
'<h1>Astrologer Not Found</h1>';

return;

}

const astro =
snap.data();

if(
astro.image &&
!astro.image.includes(
'randomuser.me'
)
){

document.getElementById(
'astroImage'
).src =
astro.image;

}else{

document.getElementById(
'astroImage'
).style.display =
'none';

}



document.getElementById(
'astroName'
).innerText =
astro.name || '';

document.getElementById(
'astroRating'
).innerText =
`⭐ ${astro.rating || '5'} Rating`;

document.getElementById(
'astroPrice'
).innerText =
`₹${astro.price || ''}/min`;

document.getElementById(
'astroLanguages'
).innerText =
astro.languages || '';

document.getElementById(
'astroExperience'
).innerText =
astro.experience || '';

document.getElementById(
'astroAbout'
).innerText =
astro.about || '';

document.getElementById(
'astroExpertise'
).innerHTML =

`<div class="tag">
${astro.expertise || ''}
</div>`;

document
.getElementById(
'consultBtn'
)
.addEventListener(
'click',
()=>{

localStorage.setItem(
'selectedAstrologer',
astro.name
);

window.location.href =
'index.html?chat=true';

}
);

}

loadAstrologer();
/* ===== CONSULTATION MODAL ===== */

window.openConsultationModal =
function(){

document
.getElementById(
'consultationModal'
)
.style.display =
'flex';

}

window.closeConsultationModal =
function(){

document
.getElementById(
'consultationModal'
)
.style.display =
'none';

}

/* ===== BOOK ===== */

window.bookConsultation =
function(){

const type =

document.getElementById(
'consultationType'
).value;

const date =

document.getElementById(
'consultationDate'
).value;

const time =

document.getElementById(
'consultationTime'
).value;

if(!date || !time){

alert(
'Please select date and time'
);

return;

}

alert(
`Consultation Booked:

${type}
${date}
${time}`
);

closeConsultationModal();

}


</script>

</body>
</html>
