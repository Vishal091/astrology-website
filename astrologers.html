<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Astrologers | Astrodhani</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ===== BODY ===== */

body{

margin:0;
font-family:'Segoe UI',sans-serif;

background:
linear-gradient(
135deg,
#f7eeee,
#f1e4e4
);

color:#fff;

}

/* ===== HEADER ===== */

.header{

background:
linear-gradient(
135deg,
#7b000f,
#a51c30
);

padding:22px;

text-align:center;

font-size:34px;
font-weight:700;

color:#FFD700;

box-shadow:
0 10px 30px rgba(0,0,0,0.25);

}

/* ===== SUBTITLE ===== */

.sub{

text-align:center;

color:#5b1010;

margin-top:12px;

font-size:18px;

}

/* ===== GRID ===== */

.grid{

width:92%;
max-width:1400px;

margin:50px auto;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));

gap:35px;

}

/* ===== CARD ===== */

.card{

background:
linear-gradient(
145deg,
#12052a,
#1d1142
);

border-radius:28px;

overflow:hidden;

box-shadow:
0 20px 40px rgba(0,0,0,0.25);

transition:0.35s;

position:relative;

}

.card:hover{

transform:
translateY(-10px);

}

/* ===== TOP ===== */

.top{

position:relative;

padding:35px 25px 20px;

text-align:center;

}

/* ===== PHOTO ===== */

.photo{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

border:4px solid #FFD700;

box-shadow:
0 10px 30px rgba(255,215,0,0.25);

}

/* ===== ONLINE ===== */

.online{

position:absolute;

top:25px;
right:25px;

background:#16a34a;

padding:8px 14px;

border-radius:30px;

font-size:13px;
font-weight:700;

}

/* ===== NAME ===== */

.name{

margin-top:18px;

font-size:28px;
font-weight:700;

color:#FFD700;

}

/* ===== EXPERIENCE ===== */

.exp{

margin-top:10px;

color:#ddd;

font-size:15px;

}

/* ===== CHARGES ===== */

.price{

margin-top:15px;

font-size:26px;
font-weight:700;

color:#fff;

}

/* ===== SECTION ===== */

.section{

padding:0 25px 25px;

}

/* ===== LABEL ===== */

.label{

color:#FFD700;

font-size:18px;
font-weight:700;

margin-top:18px;
margin-bottom:8px;

}

/* ===== TEXT ===== */

.text{

line-height:1.7;

color:#ddd;

font-size:15px;

}

/* ===== TAGS ===== */

.tags{

display:flex;
flex-wrap:wrap;
gap:10px;

margin-top:12px;

}

.tag{

background:
rgba(255,215,0,0.12);

padding:8px 14px;

border-radius:30px;

font-size:13px;

border:
1px solid rgba(255,215,0,0.2);

}

/* ===== BUTTONS ===== */

.buttons{

display:flex;
gap:14px;

margin-top:25px;

}

.btn{

flex:1;

padding:15px;

border:none;

border-radius:16px;

font-size:15px;
font-weight:700;

cursor:pointer;

transition:0.3s;

}

.chat-btn{

background:
linear-gradient(
45deg,
#FFD700,
#ffb700
);

color:black;

}

.profile-btn{

background:
rgba(255,255,255,0.08);

color:white;

border:
1px solid rgba(255,255,255,0.08);

}

.btn:hover{

transform:
translateY(-3px);

}

/* ===== MOBILE ===== */

@media(max-width:768px){

.header{

font-size:28px;

}

.name{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="header">

🔮 Meet Our Expert Astrologers

</div>

<div class="sub">

Talk to verified astrologers for accurate guidance & spiritual remedies ✨

</div>

<div
class="grid"
id="astrologersGrid"
>

</div>



<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== FIREBASE ===== */

const firebaseConfig = {

apiKey: "AIzaSyA2ytO0jnhM9baGrByUS1jgSc47q6xJ64s",

authDomain:
"astrodhani-935c8.firebaseapp.com",

projectId:
"astrodhani-935c8",

storageBucket:
"astrodhani-935c8.firebasestorage.app",

messagingSenderId:
"158324229234",

appId:
"1:158324229234:web:bff8d74888b356be362eeb"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ===== GRID ===== */

const astrologersGrid =
document.getElementById(
'astrologersGrid'
);

/* ===== LOAD ASTROLOGERS ===== */

async function loadAstrologers(){

const snapshot =
await getDocs(
collection(db,'astrologers')
);

astrologersGrid.innerHTML = '';

snapshot.forEach(docSnap=>{

const astro = {

id:docSnap.id,

...docSnap.data()

};

astrologersGrid.innerHTML += `

<div class="card">

<div class="top">

<div class="online">
Online
</div>

${
astro.image &&
!astro.image.includes('randomuser.me')

? `

<img
src="${astro.image}"
class="photo"
>

`

: ''

}



<div class="name">

${astro.name || ''}

</div>

<div class="exp">

${astro.experience || ''}

</div>

<div class="price">

₹${astro.price || ''}/min

</div>

</div>

<div class="section">

<div class="label">
🔮 Expertise
</div>

<div class="tags">

<div class="tag">

${astro.expertise || ''}

</div>

</div>

<div class="label">
🌐 Languages
</div>

<div class="text">

${astro.languages || ''}

</div>

<div class="label">
📖 About
</div>

<div class="text">

${astro.about || ''}

</div>

<div class="buttons">

<button
class="btn chat-btn"
onclick="
startConsultation(
'${astro.name}'
)
"
>

Chat Now

</button>

<button
class="btn profile-btn"
onclick="
openProfile(
'${astro.id}'
)
"
>

View Profile

</button>

</div>

</div>

</div>

`;

});

}

/* ===== START CONSULTATION ===== */

window.startConsultation =
function(astrologer){

localStorage.setItem(

"selectedAstrologer",

astrologer

);

window.location.href =
"index.html?chat=true";

}

/* ===== OPEN PROFILE ===== */

window.openProfile =
function(id){

window.location.href =

`astrologer-profile.html?id=${id}`;

}

/* ===== INIT ===== */

loadAstrologers();

</script>


</body>
</html>
